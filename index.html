<script type="module">
/* ═══ CHESS · a Multiplayer Agent starter ═════════════════════════════════════════════════
 * Real rules on a 3D board. Turn-based, 2 players; anyone else watches; a bot plays when you're alone.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ the bot, timings, colors, the leaderboard
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   RULES ......... the chess rules: FEN, legal moves, check, mate, draws, move names
 *   BOT ........... how the bot picks a move (2 moves deep + captures)
 *   GAME (HOST) ... seats, checking and applying moves, bot turns, results.
 *                   Only the host writes the shared `game` field.
 *   SCENE ......... renderer, lights, the board and its square highlights
 *   PIECES ........ the low-poly piece models, sliding them, captures, sparks
 *   MY MOVES ...... selecting a piece, legal-move dots, promotion, sending a move
 *   HUD & RESULTS . player bars, status, results card, leaderboard
 *   INPUT / LOOP .. clicks and taps, the camera, the main loop
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - The whole game lives in ONE shared field, `game`: {id, v, fen, ply, last, san, w, b, at,
 *     res, why, endsAt, rep}. `w`/`b` are the seats: a sessionId or "bot". Only the HOST
 *     writes it, and `v` goes up on every write.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. It checks every move against the rules, plays the bot's moves,
 *     hands seats to waiting players and ends the game. A new host carries on from `game`.
 *   - Each player writes its OWN entity: `n` (name), `c` (color), `hb` (heartbeat).
 *   - Players send intents to the host: "move" {g, ply, f, t, pr}, "resign" {g}, "again" {g}.
 *     The host never gets its own sends, so it applies its own moves directly.
 *   - The first two players take the seats. A seat whose player is gone for 10s goes to the
 *     bot; a waiting player takes a bot's seat, even mid-game.
 *   - ?attract plays offline, bot against bot (the preview video is recorded from it).
 *   - Leaderboard "wins": +1 for each game a player wins, shown on the results card.
 */
import * as THREE from "three";

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {

  botDepth: 2,          // moves the bot looks ahead (2 = its move and your reply)
  botCaptures: 3,       // extra captures it follows, so it sees the end of a trade
  botNoise: 35,         // random wobble in its scores (100 = a pawn), so it isn't perfect
  seatGraceMs: 10000,   // a seated player silent this long loses the seat to the bot
  resultsMs: 45000,     // results show this long, then a new game starts (Play again starts it at once)
  moveMs: 360,          // how long a piece takes to slide
  light: "#efdcb8", dark: "#a8714a", frame: "#3b2618", // the board
  whitePiece: "#f3ece0", blackPiece: "#2a2d3a",
  sky: "#1b2233",
  board: "wins",        // leaderboard name
  // ?attract starts from this open position so the preview shows captures quickly
  attractFen: "r1bqk2r/pppp1ppp/2n2n2/2b1p3/2B1P3/2N2N2/PPPP1PPP/R1BQK2R w KQkq - 6 5",

const COLORS = ["#ff6b6b", "#4dabf7", "#ffd43b", "#69db7c", "#b197fc", "#ff922b", "#f783ac", "#3bc9db"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────

const MP_CONNECT = {

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */

    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },

const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map();

const isHost = () => livePlayers()[0] === net.sessionId;
/** Still in the room and heard from within the seat grace time (a backgrounded phone keeps its seat). */
const stillHere = (id) => id === net.sessionId || (!!S.entities.players[id] && performance.now() - (seenHb.get(id)?.at ?? -1e9) < CONFIG.seatGraceMs);

// ── RULES ───────────────────────────────────────────────────────────────────────────
// A position: { b: 64 squares, turn: "w"|"b", castle: "KQkq", ep: square or -1, half, full }.
// Squares: index = rank * 8 + file, a1 = 0, h1 = 7, a8 = 56. Pieces: "PNBRQK" white, "pnbrqk" black, "" empty.
const FILES = "abcdefgh";

}
const posCache = new Map();
/** A FEN as a position, parsed once (read-only: play() always returns a new one). */
function position(fen) { let p = posCache.get(fen); if (!p) { if (posCache.size > 64) posCache.clear(); p = parseFen(fen); posCache.set(fen, p); } return p; }

/** Is square `sq` attacked by side `by`? */
function attacked(b, sq, by) {

  const pr = by === "w" ? r - 1 : r + 1; // a white pawn attacks from the rank below

  for (const [df, dr] of DIRS.k) if (is(at(f + df, r + dr), "k")) return true;

}
const kingOf = (b, c) => b.indexOf(c === "w" ? "K" : "k");

/** Every move the side to move could make, before checking its own king is safe. */

}
/** Make a move (it must come from pseudoMoves). Returns a new position; `cap` = the piece taken. */
function play(pos, m) {

// ── BOT ─────────────────────────────────────────────────────────────────────────────
const VALUE = { p: 100, n: 310, b: 330, r: 500, q: 900, k: 0 };

  const col = id === "bot" ? "#8892b0" : id === net.sessionId ? myColor : S.entities.players[id]?.c || "#ccc";
  el.className = "bar" + (!g.res && pos.turn === side ? " turn" : "");
  const html = `<span class="sw ${side}" style="box-shadow:0 0 0 3px ${esc(col)}">${GLYPH.k}</span>` +
    `<span class="nm">${esc(nameOf(id))}</span><span class="tag">${id === "bot" ? "bot" : id === net.sessionId ? "you" : ""}</span>` +
    `<span class="cap ${other(side)}">${t.out}</span>${lead > 0 ? `<span class="adv">+${lead}</span>` : ""}`;
  if (el.dataset.html !== html) { el.dataset.html = html; el.innerHTML = html; }
}
let seatsSeen = null, toastAt = 0, dropped = false, resign = 0, resultsFor = -1, closedFor = -1, board = null;
function toast(text) { $("toast").textContent = text; $("toast").style.opacity = 1; toastAt = performance.now(); }
function hud(g) {
  const pos = position(shownFen()), side = mySeat(g), bottom = side || "w", now = performance.now();
  if (now - toastAt > 3000) $("toast").style.opacity = 0;
  if (ATTRACT) { for (const id of ["top", "bottom", "status", "watch", "net"]) $(id).classList.add("hide"); return; }
  bar($("bottom"), bottom, g, pos); bar($("top"), other(bottom), g, pos);
  // seat changes: someone took over from the bot, or the bot took over
  const prev = seatsSeen;
  seatsSeen = { id: g.id, w: g.w, b: g.b };
  if (prev && prev.id === g.id) for (const c of ["w", "b"]) if (prev[c] !== g[c]) toast(`${g[c] === net.sessionId ? "You" : nameOf(g[c])} took over ${colorName(c).toLowerCase()}`);
  // status line
  const turnId = g[pos.turn], check = inCheck(pos) ? "Check! " : "";
  $("status").textContent = g.res ? (g.res === "d" ? "Draw" : `${colorName(g.res)} wins`) + ` · ${g.why}`
    : pending ? "Sending your move…"
    : side === pos.turn ? check + "Your move" + (now < hintUntil ? " · tap a piece, then a dot" : "")
    : turnId === "bot" ? check + `${CONFIG.botName} is thinking…`
    : side ? check + `${nameOf(turnId)} to move` : check + `${colorName(pos.turn)} to move · you're watching`;
  const watchers = livePlayers().filter((id) => id !== g.w && id !== g.b);
  $("watch").textContent = watchers.length ? "Watching: " + watchers.map((id) => (id === net.sessionId ? "you" : nameOf(id))).join(", ") : "";
  // the action button: resign during the game, play again after it
  const act = $("act");
  act.hidden = !side;
  if (g.res) { act.textContent = "Play again"; act.className = "go"; }
  else { act.textContent = now - resign < 3000 ? "Tap to confirm" : "Resign"; act.className = now - resign < 3000 ? "warn" : ""; }
  // results card
  if (g.res && resultsFor !== g.id) showResults(g, side);
  $("over").hidden = !g.res || closedFor === g.id;
  const n = livePlayers().length;
  $("net").textContent = net.offline ? "Offline: playing with bots" : dropped ? "Reconnecting…" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the game" : ""}`;
}
function showResults(g, side) {
  resultsFor = g.id;
  const won = side && g.res === side;
  $("overTitle").textContent = g.res === "d" ? "Draw" : won ? "You win!" : side ? "You lose" : `${colorName(g.res)} wins`;
  $("overWhy").textContent = g.why + (g.san ? ` · last move ${g.san}` : "");
  $("again2").classList.toggle("hide", !side);
  if (won) burst(new THREE.Vector3(0, 0.5, 0), "#ffd166", 60);
  const list = $("board");
  if (!board) { list.innerHTML = "<li>Leaderboards need a connection.</li>"; return; }
  list.innerHTML = "<li>Loading…</li>";
  (won ? board.submit(1, "inc").catch(() => null) : Promise.resolve()).then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${e.score}</span></li>`).join("") : "<li>No wins yet. Be the first.</li>";
  }).catch(() => { list.innerHTML = "<li>Couldn't load the leaderboard.</li>"; });
}
function playAgain() { const g = game(); if (!g || !g.res) return; const msg = { g: g.id }; if (isHost()) hostAgain(net.sessionId, msg); else net.send("again", msg); }
$("again2").onclick = playAgain;
$("look").onclick = () => { closedFor = game()?.id ?? -1; };
$("act").onclick = () => {
  const g = game();
  if (!g) return;
  if (g.res) return playAgain();
  if (performance.now() - resign > 3000) { resign = performance.now(); return; }
  resign = 0;
  if (isHost()) hostResign(net.sessionId, { g: g.id }); else net.send("resign", { g: g.id });
};

// ── INPUT / LOOP ────────────────────────────────────────────────────────────────────
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), floor = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hit = new THREE.Vector3();
/** The square under the pointer: a piece you can select or capture first, else the board. */
function squareAt(x, y) {
  ndc.set((x / innerWidth) * 2 - 1, -(y / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const g = game(), pos = g && position(g.fen);
  for (const h of ray.intersectObjects(views.filter(Boolean).map((v) => v.g), true)) {
    const sq = h.object.parent.userData.sq;
    if (pos && (colorOf(pos.b[sq]) === pos.turn || targets.some((m) => m.t === sq))) return sq;
  }
  if (!ray.ray.intersectPlane(floor, hit)) return -1;
  const f = Math.floor(hit.x + 4), r = Math.floor(4 - hit.z);
  return f >= 0 && f < 8 && r >= 0 && r < 8 ? r * 8 + f : -1;
}
renderer.domElement.addEventListener("pointerdown", (e) => { e.preventDefault(); tapSquare(squareAt(e.clientX, e.clientY)); });
addEventListener("keydown", (e) => { if (e.key === "Escape") select(-1); });
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

/** The camera sits behind your color (white for watchers) and backs off until the board fits. */
const camAt = new THREE.Vector3(), camGoal = new THREE.Vector3();
let camAngle = 0;
function aimCamera(dt, g, now) {
  const portrait = innerHeight > innerWidth, elev = ATTRACT ? 0.72 : portrait ? 1.08 : 0.98;
  const want = ATTRACT ? now / 9000 : g && mySeat(g) === "b" ? Math.PI : 0;
  camAngle += Math.atan2(Math.sin(want - camAngle), Math.cos(want - camAngle)) * Math.min(1, dt * (ATTRACT ? 10 : 3));
  const vf = THREE.MathUtils.degToRad(camera.fov) / 2, hf = Math.atan(Math.tan(vf) * camera.aspect), room = ATTRACT ? 1 : 1 - 140 / innerHeight;
  const dist = ATTRACT ? 11 : Math.max(4.9 / Math.tan(hf) + 4.6 * Math.cos(elev), (4.7 * Math.sin(elev) + 0.9 * Math.cos(elev)) / Math.tan(vf * room) + 2.3 * Math.cos(elev));
  scene.fog.near = dist; scene.fog.far = dist * 2.4;
  camGoal.set(Math.sin(camAngle) * Math.cos(elev) * dist, Math.sin(elev) * dist, Math.cos(camAngle) * Math.cos(elev) * dist);
  if (!camAt.lengthSq()) camAt.copy(camGoal);
  camAt.lerp(camGoal, Math.min(1, dt * 4));
  camera.position.copy(camAt); camera.lookAt(0, ATTRACT ? -0.4 : -0.2, 0);
}
const shown = { id: -1, fen: "" };
/** What the board shows: the game in state, or my move while it is on its way to the host. */
function shownFen() {
  const g = game();
  if (pending && (pending.fen !== g.fen || performance.now() - pending.at > 4000)) pending = null;
  return pending ? pending.next : g.fen;
}
function syncBoard(g) {
  if (shown.id !== g.id) { selected = -1; select(-1); pending = null; closedFor = -1; if (shown.id >= 0 && mySeat(g)) toast(`New game · you play ${colorName(mySeat(g)).toLowerCase()}`); }
  const fen = shownFen(), last = pending ? pending.last : g.last;
  if (fen === shown.fen && shown.id === g.id) return;
  const animate = shown.id === g.id;
  shown.id = g.id; shown.fen = fen;
  showPosition(fen, last, animate);
  if (selected >= 0) select(-1);
  putMark(marks.from, last ? sqOf(last.slice(0, 2)) : -1); putMark(marks.to, last ? sqOf(last.slice(2, 4)) : -1);
  const pos = position(fen);
  putMark(marks.check, inCheck(pos) ? kingOf(pos.b, pos.turn) : -1, 0.007);
}

let myName = "", myColor = COLORS[0], last = performance.now(), lastHb = 0, lastHud = 0;
try { myName = localStorage.getItem("mpa-name") || ""; } catch {}
const pickOne = (list) => list[Math.floor(Math.random() * list.length)];
if (!myName) { myName = pickOne(NAME_A) + " " + pickOne(NAME_B); try { localStorage.setItem("mpa-name", myName); } catch {} }
if (ATTRACT) { Object.assign(CONFIG, { botThinkMs: 420, resultsMs: 2500, botNoise: 60 }); $("net").textContent = ""; }

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // never negative: the first frame can be stamped before `last`
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  if (isHost()) hostTick();
  const g = game();
  if (g) {
    syncBoard(g);
    if (now - lastHud > 100) { lastHud = now; hud(g); }
    const sel = selected >= 0 && views[selected];
    if (sel && !anims.some((a) => a.v === sel)) sel.g.position.y = 0.14 + Math.sin(now / 180) * 0.04;
    marks.check.material.opacity = 0.6 + Math.sin(now / 160) * 0.3;
  }
  tickPieces(now, dt);
  aimCamera(dt, g, now);
  renderer.render(scene, camera);
}

/** Two players picked the same color at once (the joiner's first state can be empty): the later sessionId picks again.
 *  (The bot's ring color isn't in COLORS, so a player can never share it.) */
function fixColor() {
  const others = Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId);
  if (!others.some(([id, p]) => p.c === myColor && id < net.sessionId)) return;
  const taken = new Set(others.map(([, p]) => p.c));
  myColor = COLORS.find((c) => !taken.has(c)) || myColor; net.me.set("c", myColor);
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("move", (m, from) => { if (isHost() && m) hostMove(from, m); });
  net.on("resign", (m, from) => { if (isHost() && m) hostResign(from, m); });
  net.on("again", (m, from) => { if (isHost() && m) hostAgain(from, m); });
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const takenColors = new Set(Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c));
  myColor = COLORS.find((c) => !takenColors.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  requestAnimationFrame(frame);
})();
</script>
